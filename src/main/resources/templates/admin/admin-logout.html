<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Admin Logout | Sulaiha Smart Management System">

    <title>Logout | Sulaiha Admin</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="/css/admin-logout.css">
</head>

<body>

    <main class="admin-logout-page">

        <section class="admin-logout-card">

            <!-- Logo / Brand -->

            <div class="admin-logout-brand">

                <div class="admin-logout-logo">
                    S
                </div>

                <div class="admin-logout-brand-text">

                    <h1>SULAIHA</h1>

                    <span>ADMIN PANEL</span>

                </div>

            </div>


            <!-- Logout Icon -->

            <div class="admin-logout-icon">
                🚪
            </div>


            <!-- Content -->

            <div class="admin-logout-content">

                <h2>Logout</h2>

                <p>
                    Are you sure you want to logout
                    from the Admin Panel?
                </p>

            </div>


            <!-- Buttons -->

            <div class="admin-logout-actions">

                <button type="button"
                        class="admin-logout-cancel"
                        id="adminLogoutCancelButton">

                    Cancel

                </button>

                <button type="button"
                        class="admin-logout-confirm"
                        id="adminLogoutConfirmButton">

                    Logout

                </button>

            </div>


            <!-- Message -->

            <div class="admin-logout-message"
                 id="adminLogoutMessage"
                 role="status"
                 aria-live="polite">
            </div>


            <!-- Footer -->

            <p class="admin-logout-footer">

                © 2026 Sulaiha Smart Management System

            </p>

        </section>

    </main>


    <script src="/js/admin-logout.js"></script>

</body>

</html>
