<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Reset your password - Sulaiha Smart Management System">

    <title>Forgot Password | Sulaiha Smart Management System</title>


    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <!-- Common CSS -->

    <link rel="stylesheet" href="/css/style.css">

</head>


<body>


    <!-- =========================================
         FORGOT PASSWORD PAGE
         ========================================= -->

    <main class="forgot-password-page">


        <!-- Background Overlay -->

        <div class="forgot-password-overlay"></div>


        <!-- =====================================
             FORGOT PASSWORD CARD
             ===================================== -->

        <section class="forgot-password-card">


            <!-- BRAND -->

            <header class="forgot-password-brand">

                <h1>SULAIHA</h1>

                <h2>Smart Management System</h2>

                <p>
                    Marble &amp; Building Materials Management
                </p>

            </header>


            <!-- PAGE TITLE -->

            <div class="forgot-password-heading">

                <h3>Forgot Password?</h3>

                <p>
                    Enter your registered email and create
                    a new password.
                </p>

            </div>


            <!-- =================================
                 RESET PASSWORD FORM
                 ================================= -->

            <form id="forgotPasswordForm">


                <!-- Registered Email -->

                <div class="forgot-form-group">

                    <label for="email">
                        Registered Email ID
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- New Password -->

                <div class="forgot-form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        placeholder="Enter your new password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="forgot-form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your new password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Reset Button -->

                <button
                    type="submit"
                    class="forgot-submit-button">

                    RESET PASSWORD

                </button>


            </form>


            <!-- Back to Login -->

            <div class="forgot-login">

                <a href="/login">
                    ← Back to Login
                </a>

            </div>


        </section>

    </main>


</body>

</html>
