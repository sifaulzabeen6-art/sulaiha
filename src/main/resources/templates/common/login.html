<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Sulaiha Smart Management System</title>

    <link rel="stylesheet" href="/css/style.css">

</head>


<body>

    <!-- =========================================
         LOGIN PAGE
         ========================================= -->

    <main class="login-page">


        <!-- Background Overlay -->

        <div class="login-overlay"></div>


        <!-- Login Card -->

        <div class="login-card">


            <!-- Brand -->

            <div class="login-brand">

                <h1>SULAIHA</h1>

                <p>Smart Management System</p>

            </div>


            <!-- Login Heading -->

            <div class="login-heading">

                <h2>Login</h2>

                <p>
                    Login to access your account
                </p>

            </div>


            <!-- Login Form -->

            <form id="loginForm" action="/login" method="post">

                <input type="hidden"
       th:name="${_csrf.parameterName}"
       th:value="${_csrf.token}">
                <!-- Email -->

                <div class="login-form-group">

                    <label for="email">
                        Email ID
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="login-form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Role -->

                <div class="login-form-group">

                    <label for="role">
                        Login As
                    </label>

                    <select
                        id="role"
                        name="role"
                        required
                    >

                        <option value="">
                            Select Role
                        </option>

                        <option value="USER">
                            User
                        </option>

                        <option value="ADMIN">
                            Admin
                        </option>

                    </select>

                </div>


                <!-- Forgot Password -->

                <div class="login-options">

                    <a href="/forgot-password">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-submit-button"
                >
                    LOGIN
                </button>


            </form>


            <!-- Register -->

            <div class="login-register">

                <p>
                    New customer?
                </p>

                <a href="/register">
                    Create New Account
                </a>

            </div>


            <!-- Back to Welcome -->

            <div class="login-back">

                <a href="/welcome">
                    ← Back to Welcome
                </a>

            </div>


        </div>

    </main>


</body>

</html>
